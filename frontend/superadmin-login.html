<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academe — Super Admin Login</title>
  <meta name="description" content="Dedicated administrative portal access" />
  <link rel="stylesheet" href="portal-common.css" />
  <link rel="stylesheet" href="login.css" />
  <style>
    .login-card::before {
      background: linear-gradient(90deg, #ec4899, #f43f5e, #8b5cf6) !important;
    }
    .login-logo-box {
      background: linear-gradient(135deg, #ec4899, #be185d) !important;
      box-shadow: 0 8px 24px rgba(236, 72, 153, 0.35) !important;
    }
  </style>
</head>
<body>
  <div class="bg-mesh" aria-hidden="true">
    <div class="mesh-blob mesh-blob-1" style="background: radial-gradient(circle, #ec4899 0%, transparent 70%);"></div>
    <div class="mesh-blob mesh-blob-2"></div>
  </div>

  <main class="login-page-wrapper">
    <div class="login-card-container">
      <div class="login-card">
        <header class="login-brand-header">
          <div class="login-logo-box" aria-hidden="true">👑</div>
          <h1 class="login-title">Super Admin Portal</h1>
          <p class="login-subtitle">Restricted Platform Control Center</p>
        </header>

        <!-- Quick Demo Pill -->
        <div style="margin-bottom: 1.5rem; text-align: center;">
          <button type="button" class="btn btn-secondary" id="fillAdminDemoBtn" style="font-size: 0.8rem; width: 100%;">
            👑 Master Superadmin (superadmin / admin123)
          </button>
        </div>

        <form id="adminLoginForm">
          <div class="form-group">
            <label class="form-label" for="adminEmail">Administrator Username or Email</label>
            <input id="adminEmail" type="text" class="form-input" placeholder="superadmin or admin@academe.edu" value="superadmin" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="adminPassword">Master Password</label>
            <input id="adminPassword" type="password" class="form-input" placeholder="admin123" value="admin123" required />
          </div>

          <button type="submit" class="btn btn-primary" id="adminSubmitBtn" style="width: 100%; margin-top: 1rem; background: linear-gradient(135deg, #ec4899, #be185d);">
            <span>Authenticate Admin Session</span>
            <span>→</span>
          </button>
        </form>

        <footer class="alt-logins-footer">
          <a href="login.html" class="alt-link">← Return to Unified Login Gateway</a>
        </footer>
      </div>
    </div>
  </main>

  <script src="portal-state.js"></script>
  <script>
    (function () {
      const state = window.PortalState;
      const form = document.getElementById('adminLoginForm');
      const emailInput = document.getElementById('adminEmail');
      const passInput = document.getElementById('adminPassword');
      const submitBtn = document.getElementById('adminSubmitBtn');

      document.getElementById('fillAdminDemoBtn').addEventListener('click', () => {
        emailInput.value = 'superadmin';
        passInput.value = 'admin123';
        state.showToast('Pre-filled Superadmin credentials', 'info');
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Verifying Admin Rights...</span>';

        setTimeout(() => {
          const res = state.superadminLogin(emailInput.value, passInput.value);
          if (res.success) {
            state.showToast('Super Admin access granted. Entering console...', 'success');
            setTimeout(() => window.location.href = res.redirect, 600);
          } else {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Authenticate Admin Session</span><span>→</span>';
            state.showToast(res.message, 'error');
          }
        }, 400);
      });
    })();
  </script>
</body>
</html>
